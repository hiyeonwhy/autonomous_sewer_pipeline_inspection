# 컨테이너 내부 정적 서빙 설정.
# TLS와 /api, /media 프록시는 호스트 nginx가 담당하므로 여기서는 정적 파일만 책임진다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 결함 캡처 업로드 상한(백엔드 10MB)에 맞춘 여유값. 기본 1MB로는 413이 난다.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # vite가 해시를 붙여 내보내는 자산이라 장기 캐시해도 안전하다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html을 캐시하면 배포해도 구버전이 남으므로 항상 재검증한다
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 배포 확인용. 어떤 커밋이 올라가 있는지 컨테이너 밖에서 볼 수 있어야
    # 스모크 테스트가 "새 버전이 떴는지"를 판정할 수 있다. 캐시되면 낡은 커밋을
    # 보고해 드리프트 감시가 무력해지므로 no-store.
    location = /build-info.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # maplibre 워커와 그 shared 청크 (vite.config.ts 의 maplibreWorkerAssets 가 복사).
    #
    # default_type 이 필요한 이유: nginx 의 기본 mime.types 에는 .mjs 매핑이 없어서
    # application/octet-stream 으로 나가고, 그러면 브라우저가 **모듈 스크립트 실행을
    # 거부한다.** 200 으로 받아가는데도 워커가 빈 메시지로 죽고, GeoJSON 소스가
    # 로드되지 않아 배경지도만 뜨고 폴리곤이 하나도 안 그려진다 (2026-08-03).
    #
    # 파일명에 해시가 없다(워커가 shared 청크를 상대 경로로 import 하므로 고정 이름이
    # 필요하다). 그래서 장기 캐시하면 maplibre 업그레이드 후 낡은 워커가 남는다.
    location ^~ /maplibre/ {
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        # 클라이언트 라우터는 아직 없지만, 향후 도입 시 새로고침 404를 막기 위한 사전 조치.
        try_files $uri $uri/ /index.html;
    }
}

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecheckkk-ai"
version = "0.1.0"
description = "PipeCheckkk integrated mission agent and API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pillow>=10,<13",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]
models = [
  "accelerate>=1,<2",
  "autoawq>=0.2.9,<0.3",
  "huggingface-hub>=0.30,<1",
  "opencv-python>=4.10,<6",
  "pillow>=10,<13",
  "qwen-vl-utils==0.0.8",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "transformers==4.51.3",
  "ultralytics>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[tool.ruff]
line-length = 100
